name: messenger_client
description: A Flutter messenger application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  
  # gRPC
  grpc: ^4.0.0
  protobuf: ^3.1.0
  
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.8.1
  
  # Storage
  shared_preferences: ^2.3.4
  
  # UI
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  
  # Utils
  intl: ^0.20.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  proto_generator:
    path: proto/

flutter:
  uses-material-design: true
  
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
