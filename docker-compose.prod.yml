services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Cassandra ──────────────────────────────────────────────
  cassandra:
    image: cassandra:5.0.9
    restart: always
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      CASSANDRA_DC: ${CASSANDRA_DC}
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra_prod_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ── RustFS (S3-compatible, attachment storage) ─────────────
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    restart: always
    ports:
      - "127.0.0.1:${RUSTFS_S3_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: "/data"
      RUSTFS_OBS_LOGGER_LEVEL: "error"
    volumes:
      - rustfs_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Rust Server ────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
    restart: always
    env_file: .env
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${GRPC_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Flutter (pre-built web assets) ─────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./client/build/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

volumes:
  postgres_prod_data:
  cassandra_prod_data:
  rustfs_prod_data:
